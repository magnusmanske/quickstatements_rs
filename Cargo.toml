[package]
name = "quickstatements"
version = "0.1.0"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2021"

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }
#wikibase = "*"
#wikibase = { path = "../wikibase_rs" }
wikibase = { git = "https://gitlab.com/tobias47n9e/wikibase_rs" }

# `mysql_async` comes from wikimisc (re-exported as `wikimisc::mysql_async`),
# so both crates always agree on the version.
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", default-features = false, features = [
    "database",
] }
serde_json = "1"
config = "*"
regex = "1"
chrono = "*"
clap = { version = "4", features = ["derive", "cargo"] }
log = "*"
simple_logger = "5"
num_cpus = "1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
futures = "*"
async-recursion = "1"
thiserror = "2"
rand = "*"
axum = "*"
tower-http = { version = "*", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"

[dev-dependencies]
wiremock = "*"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
#target-cpu = "native"
