[package]
name = "quickstatements"
version = "0.1.0"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2021"

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }

# `mysql_async`, `wikibase` and `mediawiki` come from wikimisc (re-exported as
# `wikimisc::mysql_async` etc.), so all crates always agree on the versions.
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", default-features = false, features = [
    "database",
    "date",
    "entity-id",
    "oauth1",
    "server",
    "seppuku",
    "telemetry",
    "wikibase",
] }
serde_json = "1"
config = "*"
regex = "1"
chrono = "*"
clap = { version = "4", features = ["derive", "cargo"] }
log = "*"
simple_logger = "5"
num_cpus = "1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
futures = "*"
async-recursion = "1"
thiserror = "2"
rand = "*"
axum = { version = "*", features = ["multipart"] }
tower-http = { version = "*", features = ["catch-panic"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
axum-extra = { version = "0.12", features = ["cookie-private"] }
csv = "1"
percent-encoding = "2"
form_urlencoded = "1"
cookie = { version = "0.18", features = ["key-expansion"] }

[dev-dependencies]
wiremock = "*"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
#target-cpu = "native"
